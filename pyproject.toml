[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-telemetry-hub"
version = "0.2.0"
description = "ColdChain IoT cold-chain monitor – ESP32 + MQTT + FastAPI"
requires-python = ">=3.12"
dependencies = [
  # ── Web framework ───────────────────────────────────────────────────────────
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "websockets>=13,<14",

  # ── Database ────────────────────────────────────────────────────────────────
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",

  # ── Validation / settings ───────────────────────────────────────────────────
  "pydantic-settings>=2.7,<3",

  # ── MQTT ───────────────────────────────────────────────────────────────────
  "paho-mqtt>=2.1,<3",

  # ── Auth / crypto ───────────────────────────────────────────────────────────
  "pwdlib[argon2]>=0.2,<1",
  "python-jose[cryptography]>=3.3,<4",

  # ── HTTP client (Telegram alerts) ───────────────────────────────────────────
  "httpx>=0.28,<1",

  # ── ML ─────────────────────────────────────────────────────────────────────
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
telemetry-admin  = "app.cli:main"
telemetry-worker = "app.mqtt_worker:main"
coldchain-train  = "app.ml.train:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.pytest.ini_options]
testpaths      = ["tests"]
asyncio_mode   = "auto"

[tool.ruff]
target-version = "py312"
line-length    = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api.py" = ["B008"]
