# Local development only. Add TLS/proxy and production networking before VPS deployment.
x-app: &app
  build: .
  env_file:
    - .env
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://telemetry:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/telemetry
    MQTT_HOST: mosquitto
    MQTT_USERNAME: collector
    MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
  init: true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/acl:/mosquitto/config/acl:ro
      - ./secrets:/secrets:ro
      - mqtt-data:/mosquitto/data
      - caddy-data:/caddy-data:ro
    command: >
      /bin/sh -c "
        mkdir -p /mosquitto/certs /mosquitto/config/conf.d
        chown mosquitto:mosquitto /mosquitto/certs /mosquitto/config/conf.d
        L_CERT=0
        check_certs() {
          CRT=\$$(find /caddy-data/caddy/certificates -name telemetry.durnibar.tech.crt 2>/dev/null | head -n 1)
          if [ -n \"\$$CRT\" ]; then
            N_CERT=\$$(stat -c %Y \"\$$CRT\" 2>/dev/null || echo 0)
            if [ \"\$$L_CERT\" != \"\$$N_CERT\" ]; then
              cp \"\$$CRT\" /mosquitto/certs/server.crt
              cp \$$(dirname \"\$$CRT\")/telemetry.durnibar.tech.key /mosquitto/certs/server.key
              chown mosquitto:mosquitto /mosquitto/certs/server.crt /mosquitto/certs/server.key
              echo -e 'listener 8883\ncafile /mosquitto/certs/server.crt\ncertfile /mosquitto/certs/server.crt\nkeyfile /mosquitto/certs/server.key' > /mosquitto/config/conf.d/tls.conf
              L_CERT=\"\$$N_CERT\"
              return 0
            fi
          fi
          return 1
        }
        check_certs
        mosquitto -c /mosquitto/config/mosquitto.conf &
        L_PW=\$$(stat -c %Y /secrets/mosquitto.passwd 2>/dev/null || echo 0)
        while true; do
          sleep 5
          RELOAD=0
          N_PW=\$$(stat -c %Y /secrets/mosquitto.passwd 2>/dev/null || echo 0)
          if [ \"\$$L_PW\" != \"\$$N_PW\" ]; then RELOAD=1; L_PW=\"\$$N_PW\"; fi
          if check_certs; then RELOAD=1; fi
          if [ \"\$$RELOAD\" = \"1\" ]; then kill -HUP %1; fi
        done
      "
    restart: always

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: always

  api:
    <<: *app
    # Internal port only, exposed via Caddy
    expose:
      - "8000"
    volumes:
      - ./secrets:/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  worker:
    <<: *app
    command: ["telemetry-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    restart: always

volumes:
  postgres-data:
  mqtt-data:
  caddy-data:
