# Local development only. Add TLS/proxy and production networking before VPS deployment.
x-app: &app
  build: .
  env_file:
    - .env
  environment: &app-env
    DATABASE_URL: postgresql+psycopg://telemetry:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/telemetry
    MQTT_HOST: mosquitto
    MQTT_USERNAME: collector
    MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
  init: true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: always

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/acl:/mosquitto/config/acl:ro
      - ./secrets:/secrets:ro
      - mqtt-data:/mosquitto/data
    command: >
      /bin/sh -c "
        mosquitto -c /mosquitto/config/mosquitto.conf &
        L=\$$(stat -c %Y /secrets/mosquitto.passwd 2>/dev/null || echo 0);
        while true; do
          sleep 5;
          N=\$$(stat -c %Y /secrets/mosquitto.passwd 2>/dev/null || echo 0);
          if [ \"\$$L\" != \"\$$N\" ]; then kill -HUP %1; L=\"\$$N\"; fi;
        done
      "
    restart: always

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    ports:
      - "443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/cert.pem:/etc/caddy/cert.pem:ro
      - ./docker/key.pem:/etc/caddy/key.pem:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: always

  api:
    <<: *app
    # Internal port only, exposed via Caddy
    expose:
      - "8000"
    volumes:
      - ./secrets:/secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always

  worker:
    <<: *app
    command: ["telemetry-worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    restart: always

volumes:
  postgres-data:
  mqtt-data:
  caddy-data:
